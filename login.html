<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ObjeMatch</title>
  <meta name="description" content="Sign in to ObjeMatch to save your AI room analyses and access your history.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #111827; min-height: 100vh; display: flex; flex-direction: column; }

    nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 60px; display: flex; align-items: center; }
    .logo { font-size: 20px; font-weight: 800; color: #111827; text-decoration: none; }
    .logo span { color: #f97316; }

    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }

    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 20px;
      padding: 40px; width: 100%; max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .card-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .card-sub { color: #6b7280; font-size: 15px; margin-bottom: 32px; }

    .tabs { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 28px; }
    .tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab.active { color: #f97316; border-bottom-color: #f97316; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb;
      border-radius: 10px; font-size: 15px; font-family: inherit;
      color: #111827; background: #fff; transition: border-color 0.15s;
      outline: none;
    }
    input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }

    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all 0.2s; margin-top: 4px;
    }
    .btn-primary { background: #f97316; color: #fff; }
    .btn-primary:hover { background: #ea580c; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; display: none; }

    .divider { text-align: center; color: #9ca3af; font-size: 13px; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #e5e7eb; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .benefit-list { margin-top: 28px; border-top: 1px solid #f3f4f6; padding-top: 24px; }
    .benefit { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6b7280; margin-bottom: 10px; }
    .benefit-icon { font-size: 16px; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">Obje<span>Match</span></a>
</nav>
<div class="page">
  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to access your room analyses</div>

    <div class="tabs">
      <div class="tab active" onclick="showTab('login')">Sign In</div>
      <div class="tab" onclick="showTab('register')">Create Account</div>
    </div>

    <div class="error" id="errorMsg"></div>

    <!-- Login form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" onclick="login()" id="loginBtn">Sign In</button>
    </div>

    <!-- Register form -->
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="regName" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min. 6 characters">
      </div>
      <button class="btn btn-primary" onclick="register()" id="registerBtn">Create Account</button>
    </div>

    <div class="benefit-list">
      <div class="benefit"><span class="benefit-icon">📸</span> Save unlimited room analyses</div>
      <div class="benefit"><span class="benefit-icon">🕐</span> Access your history anytime</div>
      <div class="benefit"><span class="benefit-icon">🔒</span> Free forever, no credit card</div>
    </div>
  </div>
</div>

<script>
  function showTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'login')));
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() { document.getElementById('errorMsg').style.display = 'none'; }

  async function login() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showError('Please fill in all fields');
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';
    hideError();
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('om_token', data.token);
      localStorage.setItem('om_user', JSON.stringify(data.user));
      const next = new URLSearchParams(location.search).get('next') || '/room-analyzer.html';
      location.href = next;
    } catch (err) {
      showError(err.message || 'Login failed');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  async function register() {
    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    if (!email || !password) return showError('Email and password are required');
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.textContent = 'Creating account...';
    hideError();
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('om_token', data.token);
      localStorage.setItem('om_user', JSON.stringify(data.user));
      location.href = '/room-analyzer.html';
    } catch (err) {
      showError(err.message || 'Registration failed');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('loginForm').style.display !== 'none') login();
      else register();
    }
  });

  // Redirect if already logged in
  if (localStorage.getItem('om_token')) location.href = '/room-analyzer.html';
</script>
</body>
</html>
