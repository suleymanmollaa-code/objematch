<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ObjeMatch — Discover & Track Products</title>
  <meta name="description" content="Discover real spaces, identify every product, track prices together.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #111827; }

    nav {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 0 24px; height: 60px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 20px; font-weight: 800; color: #111827; text-decoration: none; }
    .logo span { color: #f97316; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { padding: 7px 13px; border-radius: 9px; font-size: 13px; font-weight: 600; color: #6b7280; text-decoration: none; transition: all .15s; }
    .nav-link:hover, .nav-link.active { background: #fff7ed; color: #f97316; }
    .nav-right { display: flex; gap: 10px; align-items: center; }
    .btn-share { background: #f97316; color: #fff; padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none; transition: background .15s; }
    .btn-share:hover { background: #ea580c; }
    .btn-sign { font-size: 13px; color: #6b7280; font-weight: 600; text-decoration: none; padding: 7px 12px; border-radius: 8px; }
    .btn-sign:hover { background: #f3f4f6; }
    @media(max-width:600px) { .nav-links { display: none; } }

    /* Search + category bar */
    .toolbar {
      max-width: 1200px; margin: 0 auto; padding: 20px 20px 0;
      display: flex; flex-direction: column; gap: 14px;
    }
    .search-row { display: flex; gap: 10px; }
    .search-input {
      flex: 1; padding: 10px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px;
      font-size: 14px; font-family: inherit; outline: none; background: #fff; color: #111827;
    }
    .search-input:focus { border-color: #f97316; }
    .categories { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-btn {
      padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      border: 1.5px solid #e5e7eb; background: #fff; color: #6b7280; cursor: pointer;
      font-family: inherit; transition: all .15s; white-space: nowrap;
    }
    .cat-btn:hover { border-color: #f97316; color: #f97316; }
    .cat-btn.active { background: #f97316; color: #fff; border-color: #f97316; }

    /* Masonry grid */
    .grid-wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px; }
    .masonry { columns: 4; column-gap: 16px; }
    @media (max-width: 1100px) { .masonry { columns: 3; } }
    @media (max-width: 720px)  { .masonry { columns: 2; } }
    @media (max-width: 420px)  { .masonry { columns: 1; } }

    .card { break-inside: avoid; background: #fff; border-radius: 18px; border: 1px solid #e5e7eb; overflow: hidden; margin-bottom: 16px; transition: box-shadow .2s, transform .2s; }
    .card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.10); transform: translateY(-2px); }

    /* Photo with overlay */
    .card-photo-wrap { position: relative; cursor: pointer; }
    .card-photo { width: 100%; display: block; }
    .photo-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      padding: 32px 12px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .overlay-user { display: flex; align-items: center; gap: 7px; }
    .user-av { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #ef4444); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none; }
    .user-name { font-size: 12px; font-weight: 700; color: #fff; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .items-badge {
      background: rgba(255,255,255,0.2); backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
      display: flex; align-items: center; gap: 4px;
    }

    /* Expandable items */
    .items-panel { display: none; flex-direction: column; gap: 1px; border-top: 1px solid #f3f4f6; }
    .items-panel.open { display: flex; }
    .item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #fff; transition: background .1s; }
    .item-row:hover { background: #fafafa; }
    .item-info { flex: 1; min-width: 0; }
    .item-name  { font-size: 13px; font-weight: 700; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-price { font-size: 11px; font-weight: 700; color: #059669; margin-top: 1px; }
    .item-btns  { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-shop-sm { background: #111827; color: #fff; border-radius: 7px; padding: 5px 10px; font-size: 11px; font-weight: 700; text-decoration: none; white-space: nowrap; transition: background .15s; }
    .btn-shop-sm:hover { background: #374151; }
    .btn-track { background: #fff7ed; color: #f97316; border: 1px solid #fed7aa; border-radius: 7px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all .15s; }
    .btn-track:hover { background: #f97316; color: #fff; border-color: #f97316; }
    .no-items { font-size: 12px; color: #9ca3af; padding: 12px 14px; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 10px; border-top: 1px solid #f3f4f6; }
    .card-meta { display: flex; align-items: center; gap: 8px; }
    .cat-badge { font-size: 10px; font-weight: 700; background: #f3f4f6; color: #6b7280; padding: 2px 7px; border-radius: 10px; }
    .card-time  { font-size: 11px; color: #9ca3af; }
    .want-btn { background: none; border: none; font-size: 12px; color: #6b7280; cursor: pointer; font-family: inherit; font-weight: 600; display: flex; align-items: center; gap: 5px; padding: 4px 0; transition: color .15s; }
    .want-btn:hover, .want-btn.liked { color: #ef4444; }
    .share-btn { background: none; border: none; font-size: 12px; color: #9ca3af; cursor: pointer; font-family: inherit; font-weight: 600; padding: 4px 0; transition: color .15s; }
    .share-btn:hover { color: #6b7280; }

    .loading { text-align: center; padding: 80px 20px; color: #6b7280; }
    .empty { text-align: center; padding: 80px 20px; }
    .empty h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    .empty p { color: #6b7280; font-size: 15px; margin-bottom: 28px; }
    .btn-cta { display: inline-flex; align-items: center; gap: 8px; background: #111827; color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 700; text-decoration: none; }

    /* Track modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #fff; border-radius: 20px; padding: 28px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .modal-item-name { color: #374151; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .modal p { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
    .modal input { width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
    .modal input:focus { border-color: #f97316; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btns button { flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; transition: all .15s; }
    .btn-cancel { background: #f3f4f6; color: #6b7280; }
    .btn-cancel:hover { background: #e5e7eb; }
    .btn-save { background: #f97316; color: #fff; }
    .btn-save:hover { background: #ea580c; }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }
    .modal-msg { font-size: 13px; margin-top: 10px; }
    .modal-msg.ok  { color: #15803d; font-weight: 600; }
    .modal-msg.err { color: #dc2626; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">Obje<span>Match</span></a>
  <div class="nav-links">
    <a href="/feed.html" class="nav-link active">Feed</a>
    <a href="/chat.html" class="nav-link">AI Chat</a>
    <a href="/link-tracker.html" class="nav-link">Link Tracker</a>
  </div>
  <div class="nav-right">
    <a href="/dashboard.html" class="btn-sign" id="navDash" style="display:none">Dashboard</a>
    <a href="/login.html?next=/chat.html" class="btn-sign" id="navLogin">Sign in</a>
    <a href="/chat.html" class="btn-share">+ Share Photo</a>
  </div>
</nav>

<div class="toolbar">
  <div class="search-row">
    <input class="search-input" id="searchInput" placeholder="Search products, setups..." oninput="onSearch()">
  </div>
  <div class="categories">
    <button class="cat-btn active" data-cat="all" onclick="setCat(this)">All</button>
    <button class="cat-btn" data-cat="home-office" onclick="setCat(this)">Home Office</button>
    <button class="cat-btn" data-cat="living-room" onclick="setCat(this)">Living Room</button>
    <button class="cat-btn" data-cat="gaming" onclick="setCat(this)">Gaming</button>
    <button class="cat-btn" data-cat="bedroom" onclick="setCat(this)">Bedroom</button>
    <button class="cat-btn" data-cat="kitchen" onclick="setCat(this)">Kitchen</button>
    <button class="cat-btn" data-cat="car" onclick="setCat(this)">Car</button>
    <button class="cat-btn" data-cat="fashion" onclick="setCat(this)">Fashion</button>
    <button class="cat-btn" data-cat="outdoor" onclick="setCat(this)">Outdoor</button>
    <button class="cat-btn" data-cat="other" onclick="setCat(this)">Other</button>
  </div>
</div>

<div class="grid-wrap">
  <div class="loading" id="loading">Loading feed...</div>
  <div class="masonry" id="masonry" style="display:none"></div>
  <div class="empty" id="empty" style="display:none">
    <div style="font-size:52px;margin-bottom:16px">📸</div>
    <h2>Nothing here yet</h2>
    <p>Be the first to share a photo and tag products.</p>
    <a href="/chat.html" class="btn-cta">Upload a photo</a>
  </div>
</div>

<!-- Track modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal(event)">
  <div class="modal">
    <h3>📡 Track price</h3>
    <div class="modal-item-name" id="modalItemName"></div>
    <p>Paste a link from any store — we'll alert you when the price drops.</p>
    <input type="url" id="modalUrl" placeholder="https://amazon.com/... or any store link">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="modalSaveBtn" onclick="submitTrack()">Track It</button>
    </div>
    <div class="modal-msg" id="modalMsg"></div>
  </div>
</div>

<script>
  const TOKEN = localStorage.getItem('om_token');
  let currentCat  = 'all';
  let searchTimer = null;
  let currentTrackItem = null;

  if (TOKEN) {
    document.getElementById('navLogin').style.display = 'none';
    document.getElementById('navDash').style.display = '';
  }

  const CAT_LABELS = {
    'home-office': 'Home Office', 'living-room': 'Living Room', gaming: 'Gaming',
    bedroom: 'Bedroom', kitchen: 'Kitchen', car: 'Car', fashion: 'Fashion',
    outdoor: 'Outdoor', other: 'Other'
  };

  async function loadFeed() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('masonry').style.display = 'none';
    document.getElementById('empty').style.display   = 'none';

    const q   = document.getElementById('searchInput').value.trim();
    const url = `/api/feed?category=${currentCat}&q=${encodeURIComponent(q)}`;
    try {
      const res  = await fetch(url);
      const data = await res.json();
      document.getElementById('loading').style.display = 'none';
      const masonry = document.getElementById('masonry');
      masonry.innerHTML = '';

      if (!data.posts?.length) {
        document.getElementById('empty').style.display = 'block';
        return;
      }
      masonry.style.display = '';
      data.posts.forEach(p => masonry.appendChild(buildCard(p)));
    } catch {
      document.getElementById('loading').textContent = 'Failed to load. Refresh to retry.';
    }
  }

  function setCat(btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    loadFeed();
  }

  function onSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadFeed, 350);
  }

  function buildCard(post) {
    const el = document.createElement('div');
    el.className = 'card';
    const init     = (post.userName || '?')[0].toUpperCase();
    const timeAgo  = getTimeAgo(post.createdAt);
    const catLabel = CAT_LABELS[post.category] || '';
    const itemCount = (post.items || []).length;

    const itemsHtml = itemCount
      ? post.items.map((item, idx) => {
          const shopUrl = item.amazonUrl || `https://www.amazon.com/s?k=${encodeURIComponent(item.name)}`;
          return `<div class="item-row">
            <div class="item-info">
              <div class="item-name">${esc(item.name)}</div>
              ${item.price ? `<div class="item-price">${esc(item.price)}</div>` : ''}
            </div>
            <div class="item-btns">
              <a class="btn-shop-sm" href="${esc(shopUrl)}" target="_blank" rel="noopener"
                 onclick="event.stopPropagation();fetch('/api/go/${post.id}/${idx}',{method:'GET',redirect:'manual'}).catch(()=>{})">Shop</a>
              <button class="btn-track" onclick="requireAuthTrack(event,'${esc(item.name)}')">Track</button>
            </div>
          </div>`;
        }).join('')
      : `<div class="no-items">No items tagged</div>`;

    el.innerHTML = `
      <div class="card-photo-wrap" onclick="toggleItems(this)">
        <img class="card-photo" src="${esc(post.photoUrl)}" alt="" loading="lazy">
        <div class="photo-overlay">
          <div class="overlay-user">
            <a href="/profile.html?id=${post.userId}" class="user-av" onclick="event.stopPropagation()">${init}</a>
            <a href="/profile.html?id=${post.userId}" class="user-name" onclick="event.stopPropagation()">${esc(post.userName)}</a>
          </div>
          ${itemCount ? `<div class="items-badge">🏷️ ${itemCount} items</div>` : ''}
        </div>
      </div>
      <div class="items-panel">${itemsHtml}</div>
      <div class="card-footer">
        <div class="card-meta">
          ${catLabel ? `<span class="cat-badge">${catLabel}</span>` : ''}
          <span class="card-time">${timeAgo}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="want-btn" onclick="toggleWant(this,'${post.id}')">
            ♥ <span class="want-num">${post.wantCount || 0}</span>
          </button>
          <button class="share-btn" onclick="copyLink('${post.id}')">Share</button>
        </div>
      </div>`;
    return el;
  }

  function toggleItems(photoWrap) {
    const panel = photoWrap.nextElementSibling;
    panel.classList.toggle('open');
    const badge = photoWrap.querySelector('.items-badge');
    if (badge) badge.textContent = panel.classList.contains('open') ? '✕ close' : `🏷️ ${panel.querySelectorAll('.item-row').length} items`;
  }

  function requireAuthTrack(e, itemName) {
    e.stopPropagation();
    if (!TOKEN) { location.href = '/login.html?next=/feed.html'; return; }
    openTrack(e, itemName);
  }

  async function toggleWant(btn, postId) {
    if (!TOKEN) { location.href = '/login.html?next=/feed.html'; return; }
    if (btn.classList.contains('liked')) return;
    btn.classList.add('liked');
    btn.querySelector('.want-num').textContent = parseInt(btn.querySelector('.want-num').textContent) + 1;
    await fetch(`/api/posts/${postId}/want`, { method: 'POST', headers: { Authorization: `Bearer ${TOKEN}` } });
  }

  function copyLink(postId) {
    const url = `${location.origin}/post.html?id=${postId}`;
    navigator.clipboard.writeText(url).then(() => {
      alert('Link copied!');
    }).catch(() => {
      prompt('Copy this link:', url);
    });
  }

  function openTrack(e, itemName) {
    e.stopPropagation();
    if (!TOKEN) { location.href = '/login.html?next=/feed.html'; return; }
    currentTrackItem = itemName;
    document.getElementById('modalItemName').textContent = itemName;
    document.getElementById('modalUrl').value = '';
    document.getElementById('modalMsg').textContent = '';
    document.getElementById('modalMsg').className = 'modal-msg';
    document.getElementById('modalSaveBtn').disabled = false;
    document.getElementById('modalSaveBtn').textContent = 'Track It';
    document.getElementById('modalOverlay').style.display = 'flex';
    setTimeout(() => document.getElementById('modalUrl').focus(), 100);
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').style.display = 'none';
  }

  async function submitTrack() {
    const url   = document.getElementById('modalUrl').value.trim();
    const msgEl = document.getElementById('modalMsg');
    const btn   = document.getElementById('modalSaveBtn');

    if (!url) { msgEl.textContent = 'Please enter a URL.'; msgEl.className = 'modal-msg err'; return; }
    try { new URL(url); } catch { msgEl.textContent = 'Invalid URL.'; msgEl.className = 'modal-msg err'; return; }

    btn.disabled = true; btn.textContent = 'Saving...'; msgEl.textContent = '';

    try {
      const analyzeRes  = await fetch('/api/link-analyze', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}` },
        body: JSON.stringify({ url })
      });
      const analyzeData = await analyzeRes.json();
      const productName  = analyzeData.product?.name || currentTrackItem;
      const currentPrice = analyzeData.product?.currentPrice || null;

      const watchRes = await fetch('/api/link-watches', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}` },
        body: JSON.stringify({ url, productName, currentPrice, frequency: 'daily' })
      });
      if (!watchRes.ok) throw new Error();

      msgEl.textContent = "Saved! We'll alert you when the price drops.";
      msgEl.className = 'modal-msg ok';
      btn.textContent = 'Saved!';
      setTimeout(() => { document.getElementById('modalOverlay').style.display = 'none'; }, 1800);
    } catch {
      msgEl.textContent = 'Something went wrong. Try again.';
      msgEl.className = 'modal-msg err';
      btn.disabled = false; btn.textContent = 'Track It';
    }
  }

  function getTimeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60)    return 'just now';
    if (s < 3600)  return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  loadFeed();
</script>

</body>
</html>
