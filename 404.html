<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — ObjeMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #111827; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 64px; display: flex; align-items: center; }
    .logo { font-size: 20px; font-weight: 800; }
    .logo span { color: #f97316; }
    .center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 24px; padding: 56px 40px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.06); }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 15px; color: #6b7280; line-height: 1.65; margin-bottom: 32px; }
    .btn-primary { display: inline-block; background: #f97316; color: white; padding: 13px 28px; border-radius: 12px; font-size: 15px; font-weight: 700; margin-bottom: 10px; transition: background 0.15s; }
    .btn-primary:hover { background: #ea580c; }
    .btn-sec { display: inline-block; color: #6b7280; font-size: 14px; font-weight: 500; }
    .btn-sec:hover { color: #111827; }
  </style>
</head>
<body>
<nav><a href="/" class="logo">Obje<span>Match</span></a></nav>
<div class="center">
  <div class="card">
    <div class="icon">🔍</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have been moved.</p>
    <a href="/room-analyzer.html" class="btn-primary">Analyze a Photo</a><br>
    <a href="/" class="btn-sec">Back to home</a>
  </div>
</div>
</body>
</html>
