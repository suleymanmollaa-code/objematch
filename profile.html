<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Profile — ObjeMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #111827; }

    nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 800; color: #111827; text-decoration: none; }
    .logo span { color: #f97316; }
    .nav-right { display: flex; gap: 10px; align-items: center; }
    .nav-link { font-size: 13px; color: #6b7280; font-weight: 600; text-decoration: none; padding: 7px 12px; border-radius: 8px; }
    .nav-link:hover { background: #f3f4f6; }

    .page { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }

    .profile-header {
      display: flex; align-items: center; gap: 24px; margin-bottom: 40px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 28px;
    }
    .profile-av { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #ef4444); color: #fff; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .profile-name { font-size: 24px; font-weight: 800; }
    .profile-stats { display: flex; gap: 24px; margin-top: 8px; }
    .stat { text-align: center; }
    .stat-num  { font-size: 20px; font-weight: 800; }
    .stat-label { font-size: 12px; color: #6b7280; }

    .masonry { columns: 4; column-gap: 16px; }
    @media (max-width: 1100px) { .masonry { columns: 3; } }
    @media (max-width: 720px)  { .masonry { columns: 2; } }
    @media (max-width: 420px)  { .masonry { columns: 1; } }

    .card { break-inside: avoid; background: #fff; border-radius: 18px; border: 1px solid #e5e7eb; overflow: hidden; margin-bottom: 16px; transition: box-shadow .2s, transform .2s; }
    .card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.10); transform: translateY(-2px); }
    .card-photo { width: 100%; display: block; }
    .card-body  { padding: 12px 14px; }
    .item-tag   { display: inline-block; font-size: 11px; font-weight: 600; background: #f3f4f6; color: #374151; border-radius: 6px; padding: 3px 8px; margin: 3px 2px; }
    .card-time  { font-size: 11px; color: #9ca3af; margin-top: 8px; }

    .empty { text-align: center; padding: 60px 20px; }
    .empty h2 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .empty p   { color: #6b7280; font-size: 15px; }

    .loading { text-align: center; padding: 60px 20px; color: #6b7280; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">Obje<span>Match</span></a>
  <div class="nav-right">
    <a href="/feed.html" class="nav-link">Feed</a>
    <a href="/chat.html" class="nav-link">AI Chat</a>
    <a href="/dashboard.html" class="nav-link" id="navDash" style="display:none">Dashboard</a>
  </div>
</nav>

<div class="page">
  <div class="loading" id="loading">Loading profile...</div>

  <div id="content" style="display:none">
    <div class="profile-header">
      <div class="profile-av" id="profileAv"></div>
      <div>
        <div class="profile-name" id="profileName"></div>
        <div class="profile-stats">
          <div class="stat">
            <div class="stat-num" id="statPosts">0</div>
            <div class="stat-label">posts</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="statWants">0</div>
            <div class="stat-label">total wants</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="statItems">0</div>
            <div class="stat-label">products tagged</div>
          </div>
        </div>
      </div>
    </div>

    <div class="masonry" id="masonry"></div>
    <div class="empty" id="empty" style="display:none">
      <h2>No posts yet</h2>
      <p>This user hasn't shared any photos yet.</p>
    </div>
  </div>
</div>

<script>
  const TOKEN  = localStorage.getItem('om_token');
  const userId = new URLSearchParams(location.search).get('id');

  if (TOKEN) document.getElementById('navDash').style.display = '';

  async function loadProfile() {
    if (!userId) { location.href = '/feed.html'; return; }
    try {
      const res  = await fetch(`/api/users/${userId}/posts`);
      const data = await res.json();
      const posts = data.posts || [];

      document.getElementById('loading').style.display  = 'none';
      document.getElementById('content').style.display  = 'block';

      const name = posts[0]?.userName || 'User';
      document.getElementById('pageTitle').textContent  = `${name} — ObjeMatch`;
      document.getElementById('profileAv').textContent  = name[0].toUpperCase();
      document.getElementById('profileName').textContent = name;
      document.getElementById('statPosts').textContent  = posts.length;
      document.getElementById('statWants').textContent  = posts.reduce((s,p) => s + (p.wantCount||0), 0);
      document.getElementById('statItems').textContent  = posts.reduce((s,p) => s + (p.items?.length||0), 0);

      if (!posts.length) {
        document.getElementById('empty').style.display = 'block';
        return;
      }

      const masonry = document.getElementById('masonry');
      posts.forEach(post => {
        const el = document.createElement('div');
        el.className = 'card';
        const tags = (post.items||[]).slice(0,4).map(i => `<span class="item-tag">${esc(i.name)}</span>`).join('');
        el.innerHTML = `
          <a href="/post.html?id=${post.id}" style="display:block">
            <img class="card-photo" src="${esc(post.photoUrl)}" alt="" loading="lazy">
          </a>
          <div class="card-body">
            ${tags}
            <div class="card-time">${getTimeAgo(post.createdAt)} · ♥ ${post.wantCount||0}</div>
          </div>`;
        masonry.appendChild(el);
      });
    } catch {
      document.getElementById('loading').textContent = 'Failed to load.';
    }
  }

  function getTimeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60)    return 'just now';
    if (s < 3600)  return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  loadProfile();
</script>
</body>
</html>
